services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./create_test_db.sql:/docker-entrypoint-initdb.d/02-create-test-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Checks over TCP on purpose: while init scripts run, Postgres only listens on a
      # unix socket, so this passes only after schema.sql has been applied.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger
      TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger_test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
